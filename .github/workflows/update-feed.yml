name: Update public election feed

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: election-data-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate feed from public sources
        run: python scripts/update_feed.py

      - name: Validate JSON
        shell: bash
        run: |
          python -m json.tool public/api/v1/elections/spain/2026/latest.json >/dev/null
          python - <<'PY'
          import json
          d=json.load(open("public/api/v1/elections/spain/2026/latest.json"))
          assert d["dataType"]=="ESTIMATE"
          assert sum(p["seats"] for p in d["parties"])==350
          assert len(d["provinces"])==52
          assert sum(p["seats"] for p in d["provinces"])==350
          assert d["pollCount"]>0
          print("Feed validado:", d["dataAsOf"], d["pollCount"], "encuestas/casas")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: election-feed
          path: public
          retention-days: 30

      - name: Publish JSON into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf api meta
          rm -f index.html
          cp -a public/api ./api
          cp -a public/meta ./meta
          cp public/index.html ./index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api meta index.html
          if git diff --cached --quiet; then
            echo "No hay cambios de datos."
          else
            git commit -m "data: refresh election feed"
            git push
          fi
